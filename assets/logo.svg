<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Sharpen prompt logo: a magic wand over a prompt line</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#A33BEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#FFC233"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>

  <!-- The prompt: a caret and a line, as typed in a terminal -->
  <path d="M50 168 L72 186 L50 204" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="92" y1="196" x2="204" y2="196" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round"/>

  <!-- The wand, from lower left to the spark -->
  <line x1="84" y1="150" x2="160" y2="74" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <line x1="141" y1="93" x2="160" y2="74" stroke="#2A1E6B" stroke-opacity="0.35" stroke-width="13" stroke-linecap="round"/>

  <!-- The spark at the tip, and two small ones -->
  <path d="M178 26 C182 46 188 52 208 56 C188 60 182 66 178 86 C174 66 168 60 148 56 C168 52 174 46 178 26 Z" fill="url(#spark)"/>
  <path d="M214 98 C216 107 219 110 228 112 C219 114 216 117 214 126 C212 117 209 114 200 112 C209 110 212 107 214 98 Z" fill="#FFF4C2"/>
  <path d="M124 34 C125 40 127 42 133 43 C127 44 125 46 124 52 C123 46 121 44 115 43 C121 42 123 40 124 34 Z" fill="#FFF4C2" fill-opacity="0.9"/>
</svg>
